<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wb.prediction</title>
<style>
:root{--bg:#eef2f4;--ink:#14232b;--mute:#5b6b73;--line:#cbd5da;--acc:#0f7b6c;--accink:#fff;--card:#f8fafb;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10191e;--ink:#e4edf0;--mute:#8fa3ab;--line:#2a3a42;--acc:#4fc4b0;--accink:#0b1a17;--card:#16222a;--bad:#ff8a80}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0 auto;max-width:640px;padding:24px 20px 60px;color:var(--ink);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
a{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:24px}
.top a.home{text-decoration:none;color:var(--ink)}
h1.brand{font:700 28px/1.2 Georgia,"Iowan Old Style",serif;margin:0}
.tag{color:var(--mute);margin:4px 0 0;font-size:15px}
.who{text-align:right;font-size:14px;color:var(--mute);flex-shrink:0}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.who .btn{padding:6px 12px;margin-top:4px;font-size:14px}
.item{display:block;padding:18px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:1px solid var(--line)}
.item h2{font:700 21px/1.35 Georgia,"Iowan Old Style",serif;margin:0 0 4px;overflow-wrap:anywhere}
.item:hover h2,.item:focus-visible h2{color:var(--acc)}
.item p{margin:6px 0 0;color:var(--mute);font-size:16px;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:14px}
article h2{font:700 28px/1.3 Georgia,"Iowan Old Style",serif;margin:8px 0 18px;overflow-wrap:anywhere}
article p{margin:0 0 1.1em;overflow-wrap:anywhere}
.back{display:inline-block;margin-bottom:12px;font-size:15px}
form,.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:24px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
textarea{min-height:130px;resize:vertical}
.err{color:var(--bad);font-size:15px}
.empty{color:var(--mute);padding:20px 0}
footer{margin-top:40px;color:var(--mute);font-size:14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<div class="top">
  <a class="home" href="#"><h1 class="brand" id="brand"></h1><p class="tag" id="tag"></p></a>
  <div class="who" id="who"></div>
</div>
<main id="app"></main>
<footer id="foot"></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== EDIT DI SINI ====== */
const BLOG = {
  nama: "wb.prediction",
  deskripsi: "Tulisan dari komunitas wb.prediction.",
  footer: "© 2026 wb.prediction"
};
// Email Google kamu (admin, bisa hapus semua postingan). Harus sama dengan di aturan Firestore.
const ADMIN_EMAIL = "scenangka@gmail.com";
// Tempel config dari Firebase Console (Project settings → Your apps → Web)
const firebaseConfig = {
  apiKey: "AIzaSyAZQuaa9qx4KZwFHPvk9ygJ_WphFnJ9Qnk",
  authDomain: "wb-prediction.firebaseapp.com",
  projectId: "wb-prediction",
  storageBucket: "wb-prediction.firebasestorage.app",
  messagingSenderId: "229482027147",
  appId: "1:229482027147:web:b960d808af5f39721bdc8e"
};
/* ====== SELESAI ====== */

const $ = id => document.getElementById(id);
const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tgl = t => { if (!t) return "baru saja"; const d = t.toDate(); return `${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`; };

$("brand").textContent = BLOG.nama;
$("tag").textContent = BLOG.deskripsi;
$("foot").textContent = BLOG.footer;

if (firebaseConfig.apiKey.startsWith("ISI")) {
  $("app").innerHTML = `<div class="note"><b>Firebase belum disambung.</b><p>Isi <b>firebaseConfig</b> dan <b>ADMIN_EMAIL</b> di bagian EDIT DI SINI pada file blog.html.</p></div>`;
  throw new Error("Firebase config belum diisi");
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let user = null, posts = [], loaded = false, loadErr = "";

const isAdmin = () => user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
const canDelete = p => user && (isAdmin() || p.uid === user.uid);

function renderWho(){
  if (user) {
    $("who").innerHTML = `${esc(user.displayName || user.email)}${isAdmin() ? " (admin)" : ""}<br><button class="btn ghost" id="out">Keluar</button>`;
    $("out").onclick = () => signOut(auth);
  } else {
    $("who").innerHTML = `<button class="btn ghost" id="in">Masuk</button>`;
    $("in").onclick = login;
  }
}

async function login(){
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") alert("Gagal masuk: " + e.code); }
}

function render(){
  const id = decodeURIComponent(location.hash.slice(1));
  const main = $("app");
  if (loadErr) { main.innerHTML = `<p class="err">${esc(loadErr)}</p>`; return; }
  if (!loaded) { main.innerHTML = `<p class="empty">Memuat…</p>`; return; }

  if (id) {
    const p = posts.find(x => x.id === id);
    if (!p) { main.innerHTML = `<a class="back" href="#">‹ Semua tulisan</a><p class="empty">Postingan tidak ditemukan atau sudah dihapus.</p>`; return; }
    document.title = p.judul + " · " + BLOG.nama;
    const body = p.isi.split(/\n+/).filter(Boolean).map(l => `<p>${esc(l)}</p>`).join("");
    main.innerHTML = `<a class="back" href="#">‹ Semua tulisan</a><article><span class="meta">${esc(p.nama)} · ${tgl(p.createdAt)}</span><h2>${esc(p.judul)}</h2>${body}</article>${canDelete(p) ? `<button class="btn del" id="del">Hapus postingan</button>` : ""}`;
    const d = $("del");
    if (d) d.onclick = async () => {
      if (!confirm("Hapus postingan ini?")) return;
      d.disabled = true;
      try { await deleteDoc(doc(db, "posts", p.id)); location.hash = ""; }
      catch (e) { alert("Gagal hapus: " + e.code); d.disabled = false; }
    };
    window.scrollTo(0, 0);
    return;
  }

  document.title = BLOG.nama;
  const composer = user
    ? `<form id="f"><label for="j">Judul</label><input id="j" maxlength="120" required><label for="i">Isi</label><textarea id="i" maxlength="5000" required></textarea><button class="btn" id="kirim">Kirim</button></form>`
    : `<div class="note">Mau menulis? <button class="btn" id="in2">Masuk dengan Google</button></div>`;
  const list = posts.length
    ? posts.map(p => `<a class="item" href="#${encodeURIComponent(p.id)}"><span class="meta">${esc(p.nama)} · ${tgl(p.createdAt)}</span><h2>${esc(p.judul)}</h2><p>${esc(p.isi.slice(0, 120))}${p.isi.length > 120 ? "…" : ""}</p></a>`).join("")
    : `<p class="empty">Belum ada tulisan. Jadilah yang pertama.</p>`;
  main.innerHTML = composer + list;

  const f = $("f");
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const b = $("kirim"); b.disabled = true;
    try {
      await addDoc(collection(db, "posts"), {
        judul: $("j").value.trim(),
        isi: $("i").value.trim(),
        uid: user.uid,
        nama: user.displayName || "Anonim",
        createdAt: serverTimestamp()
      });
      f.reset();
    } catch (err) { alert("Gagal kirim: " + err.code); }
    b.disabled = false;
  };
  const i2 = $("in2"); if (i2) i2.onclick = login;
}

onAuthStateChanged(auth, u => { user = u; renderWho(); render(); });
window.addEventListener("hashchange", render);
renderWho();
render();

onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(100)),
  snap => { posts = snap.docs.map(d => ({ id: d.id, ...d.data() })); loaded = true; loadErr = ""; render(); },
  err => { loadErr = "Gagal memuat tulisan: " + err.code; render(); });
</script>
</body>
</html>
